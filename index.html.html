<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6F0">
  <meta name="creative-medium" content="interactive-prototype">
  <title>拍照秘籍 · 出门拍照不迷茫</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #FAF6F0;
      color: #3A2E26;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
      line-height: 1.5;
    }
    #root { height: 100%; width: 100%; }
    .app-container {
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #FAF6F0;
      overflow: hidden;
    }
    .page-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }
    .page-scroll::-webkit-scrollbar { display: none; }
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(250, 246, 240, 0.95);

      -webkit-backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-bottom: 1px solid rgba(212, 165, 116, 0.15);
    }
    .top-bar.with-back {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #5C4033;
      cursor: pointer;
      padding: 0;
      font-size: 20px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .back-btn:active { background: rgba(212, 165, 116, 0.2); }
    .top-title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      color: #3A2E26;
      text-align: center;
      margin-right: 32px;
    }
    .hero-section { padding: 20px 16px 16px; position: relative; }
    .hero-title {
      font-family: "Noto Serif SC", serif;
      font-size: 28px;
      font-weight: 700;
      color: #3A2E26;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .hero-subtitle { font-size: 13px; color: #8B7355; margin-bottom: 14px; }
    .search-box {
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 20px;
      padding: 9px 14px;
      border: 1px solid rgba(212, 165, 116, 0.2);
      box-shadow: 0 2px 8px rgba(212, 165, 116, 0.08);
    }
    .search-icon { width: 18px; height: 18px; color: #B8956E; margin-right: 8px; flex-shrink: 0; }
    .search-input {
      flex: 1; border: none; outline: none; background: transparent;
      font-size: 14px; color: #3A2E26; font-family: inherit;
    }
    .search-input::placeholder { color: #B8956E; }
    .search-clear {
      width: 18px; height: 18px; border-radius: 50%; background: #D4C4B0;
      color: #fff; font-size: 11px; display: flex; align-items: center;
      justify-content: center; border: none; cursor: pointer; flex-shrink: 0;
    }
    .category-section { padding: 8px 16px 20px; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    .section-title {
      font-family: "Noto Serif SC", serif; font-size: 18px; font-weight: 600; color: #3A2E26;
    }
    .section-count { font-size: 12px; color: #A89070; }
    .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .category-card {
      background: #fff; border-radius: 14px; padding: 14px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      border: 1px solid rgba(212, 165, 116, 0.15); cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative; overflow: hidden;
    }
    .category-card:active { transform: scale(0.96); box-shadow: 0 4px 12px rgba(212, 165, 116, 0.2); }
    .category-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .category-name { font-size: 12px; font-weight: 500; color: #3A2E26; text-align: center; line-height: 1.3; }
    .category-count { font-size: 10px; color: #A89070; }
    .tips-section { padding: 0 16px 20px; }
    .tips-card {
      background: linear-gradient(135deg, #F5EBE0 0%, #E8D5C4 100%);
      border-radius: 16px; padding: 18px; position: relative; overflow: hidden;
    }
    .tips-card::before {
      content: "📸"; position: absolute; right: -10px; bottom: -10px; font-size: 80px; opacity: 0.1;
    }
    .tips-title {
      font-family: "Noto Serif SC", serif; font-size: 16px; font-weight: 700; color: #5C4033; margin-bottom: 12px;
    }
    .tips-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .tips-list li { font-size: 13px; color: #6B5344; display: flex; gap: 8px; line-height: 1.5; }
    .tips-list li::before {
      content: "✦"; color: #D4A574; flex-shrink: 0; font-size: 10px; margin-top: 4px;
    }
    .random-btn-wrapper { padding: 0 16px 20px; }
    .random-btn {
      width: 100%; background: linear-gradient(135deg, #D4A574 0%, #B8865A 100%);
      color: #fff; border: none; border-radius: 16px; padding: 16px;
      font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 6px 20px rgba(212, 165, 116, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .random-btn:active { transform: scale(0.98); box-shadow: 0 3px 12px rgba(212, 165, 116, 0.3); }
    .pose-card {
      background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 2px 12px rgba(212, 165, 116, 0.1);
      border: 1px solid rgba(212, 165, 116, 0.12); margin-bottom: 16px;
    }
    .pose-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid rgba(212, 165, 116, 0.1);
    }
    .pose-card-title {
      font-size: 15px; font-weight: 600; color: #3A2E26; display: flex; align-items: center; gap: 6px;
    }
    .pose-card-title-icon { font-size: 18px; }
    .fav-btn {
      width: 32px; height: 32px; border: none; background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      border-radius: 50%; transition: transform 0.2s ease; padding: 0;
    }
    .fav-btn:active { transform: scale(0.85); }
    .pose-images-row {
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch; padding: 12px; gap: 10px; scrollbar-width: none;
    }
    .pose-images-row::-webkit-scrollbar { display: none; }
    .pose-thumb {
      flex-shrink: 0; width: 120px; height: 160px; border-radius: 10px;
      overflow: hidden; scroll-snap-align: start; position: relative; cursor: pointer; background: #F0E8DC;
    }
    .pose-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pose-card-body {
      padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px;
    }
    .pose-tip-block { display: flex; gap: 10px; }
    .pose-tip-icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
    }
    .pose-tip-content { flex: 1; font-size: 13px; color: #5C4A3A; line-height: 1.6; }
    .pose-tip-label { font-size: 11px; font-weight: 600; color: #B8956E; margin-bottom: 2px; letter-spacing: 0.5px; }
    .pose-tag-row { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
    .pose-tag {
      font-size: 11px; padding: 3px 8px; border-radius: 10px;
      background: rgba(212, 165, 116, 0.12); color: #8B7355;
    }
    .image-viewer-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92); z-index: 1000; display: flex; flex-direction: column;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .image-viewer-overlay.active { opacity: 1; pointer-events: auto; }
    .viewer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px; color: #fff; position: relative; z-index: 2;
    }
    .viewer-counter { font-size: 14px; opacity: 0.8; }
    .viewer-close {
      width: 32px; height: 32px; border: none; background: rgba(255,255,255,0.15);
      color: #fff; border-radius: 50%; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .viewer-track {
      flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .viewer-track::-webkit-scrollbar { display: none; }
    .viewer-slide {
      flex: 0 0 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .viewer-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .viewer-footer {
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); color: #fff; font-size: 13px; text-align: center; opacity: 0.7;
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(212, 165, 116, 0.15);
      display: flex; justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 50;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 0; border: none; background: transparent; cursor: pointer;
      font-family: inherit; color: #A89070; transition: color 0.2s ease;
    }
    .nav-item.active { color: #D4A574; }
    .nav-icon { font-size: 22px; line-height: 1; }
    .nav-label { font-size: 11px; font-weight: 500; }
    .category-header {
      padding: 20px 16px; background: linear-gradient(135deg, rgba(212, 165, 116, 0.15) 0%, rgba(212, 165, 116, 0.05) 100%);
    }
    .category-header-title {
      font-family: "Noto Serif SC", serif; font-size: 24px; font-weight: 700; color: #3A2E26; margin-bottom: 8px;
    }
    .category-header-desc { font-size: 13px; color: #8B7355; line-height: 1.6; margin-bottom: 12px; }
    .category-poses { padding: 16px; }
    .pose-item {
      background: #fff; border-radius: 14px; overflow: hidden; margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(212, 165, 116, 0.08); border: 1px solid rgba(212, 165, 116, 0.12);
    }
    .pose-item-image-wrapper {
      position: relative; width: 100%; padding-top: 75%; overflow: hidden; background: #F0E8DC;
    }
    .pose-item-image-wrapper img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; cursor: pointer;
    }
    .pose-item-badge {
      position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.55);
      color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 10px; z-index: 2;
    }
    .pose-item-content { padding: 12px 14px 14px; }
    .pose-item-title {
      font-size: 14px; font-weight: 600; color: #3A2E26; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .pose-item-desc { font-size: 12px; color: #6B5344; line-height: 1.6; }
    .random-page { padding: 20px 16px; display: flex; flex-direction: column; align-items: center; }
    .random-card {
      width: 100%; background: #fff; border-radius: 20px; overflow: hidden;
      box-shadow: 0 8px 30px rgba(212, 165, 116, 0.2); border: 1px solid rgba(212, 165, 116, 0.15);
      transform-style: preserve-3d; transition: transform 0.4s ease, opacity 0.4s ease;
    }
    .random-card.flipping { transform: rotateY(90deg) scale(0.9); opacity: 0.5; }
    .random-card-image { position: relative; width: 100%; padding-top: 100%; overflow: hidden; background: #F0E8DC; }
    .random-card-image img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .random-card-cat {
      position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,0.9);
      color: #5C4033; font-size: 12px; padding: 5px 12px; border-radius: 14px; font-weight: 500; backdrop-filter: blur(8px);
    }
    .random-card-fav {
      position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.9); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 20px; backdrop-filter: blur(8px); padding: 0;
    }
    .random-card-body { padding: 18px; }
    .random-card-title {
      font-family: "Noto Serif SC", serif; font-size: 18px; font-weight: 700; color: #3A2E26; margin-bottom: 14px;
    }
    .random-tip { margin-bottom: 14px; }
    .random-tip:last-child { margin-bottom: 0; }
    .random-tip-label { font-size: 11px; font-weight: 600; color: #B8956E; margin-bottom: 4px; letter-spacing: 0.5px; }
    .random-tip-text { font-size: 13px; color: #5C4A3A; line-height: 1.6; }
    .random-reload-btn {
      margin-top: 24px; background: linear-gradient(135deg, #D4A574 0%, #B8865A 100%);
      color: #fff; border: none; border-radius: 50px; padding: 14px 32px;
      font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
      display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(212, 165, 116, 0.35);
      transition: transform 0.15s ease;
    }
    .random-reload-btn:active { transform: scale(0.96); }
    .fav-empty { padding: 80px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .fav-empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.6; }
    .fav-empty-title { font-size: 16px; font-weight: 600; color: #5C4033; margin-bottom: 8px; }
    .fav-empty-desc { font-size: 13px; color: #A89070; line-height: 1.6; }
    .fav-list { padding: 16px; }
    .toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(58, 46, 38, 0.9); color: #fff; padding: 12px 24px;
      border-radius: 8px; font-size: 14px; z-index: 2000; opacity: 0;
      pointer-events: none; transition: opacity 0.2s ease;
    }
    .toast.show { opacity: 1; }
    .search-results { padding: 12px 16px 20px; }
    .search-result-item {
      background: #fff; border-radius: 12px; padding: 12px 14px;
      display: flex; align-items: center; gap: 12px; margin-bottom: 8px; cursor: pointer;
      border: 1px solid rgba(212, 165, 116, 0.12); transition: background 0.15s ease;
    }
    .search-result-item:active { background: #F5EBE0; }
    .search-result-icon {
      width: 42px; height: 42px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
    }
    .search-result-info { flex: 1; min-width: 0; }
    .search-result-name { font-size: 14px; font-weight: 500; color: #3A2E26; margin-bottom: 2px; }
    .search-result-tags { font-size: 11px; color: #A89070; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-result-count { font-size: 12px; color: #B8956E; flex-shrink: 0; }
    .search-highlight { color: #D4A574; font-weight: 600; }
    .custom-badge {
      position: absolute; top: 6px; right: 6px; font-size: 9px; padding: 2px 6px;
      border-radius: 8px; background: rgba(212, 165, 116, 0.15); color: #B8956E; font-weight: 500;
    }
    .custom-tag {
      display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 6px;
      background: rgba(212, 165, 116, 0.15); color: #B8956E; margin-left: 6px; vertical-align: middle;
    }
    .add-category-card { border: 2px dashed rgba(212, 165, 116, 0.3); background: rgba(255, 255, 255, 0.5); }
    .add-category-icon { background: rgba(212, 165, 116, 0.1) !important; color: #D4A574; font-size: 26px !important; font-weight: 300; }
    .add-photo-card {
      background: #fff; border-radius: 14px; border: 2px dashed rgba(212, 165, 116, 0.35);
      padding: 40px 20px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease;
    }
    .add-photo-card:active { background: #FDF8F0; border-color: #D4A574; }
    .add-photo-icon {
      width: 48px; height: 48px; border-radius: 50%; background: rgba(212, 165, 116, 0.12);
      color: #D4A574; font-size: 28px; display: flex; align-items: center; justify-content: center; font-weight: 300;
    }
    .add-photo-text { font-size: 15px; font-weight: 600; color: #5C4033; }
    .add-photo-hint { font-size: 12px; color: #A89070; }
    .delete-cat-btn {
      width: 32px; height: 32px; border: none; background: transparent; cursor: pointer;
      font-size: 18px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; padding: 0; flex-shrink: 0;
    }
    .delete-cat-btn:active { background: rgba(217, 83, 79, 0.1); }
    .small-fav-btn { width: 28px; height: 28px; font-size: 16px; }
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(58, 46, 38, 0.5); z-index: 1500;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-content {
      background: #FFFBF5; border-radius: 20px; width: 100%; max-width: 380px;
      max-height: 85vh; overflow-y: auto; padding: 24px;
      box-shadow: 0 20px 60px rgba(58, 46, 38, 0.25); animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      from { transform: translateY(20px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .modal-title {
      font-family: "Noto Serif SC", serif; font-size: 20px; font-weight: 700; color: #3A2E26; margin-bottom: 18px; text-align: center;
    }
    .confirm-modal { max-width: 320px; }
    .confirm-message { font-size: 14px; color: #5C4A3A; line-height: 1.6; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: #8B7355; margin-bottom: 6px; letter-spacing: 0.3px; }
    .form-required { color: #D9534F; }
    .form-input {
      width: 100%; padding: 10px 12px; border: 1px solid rgba(212, 165, 116, 0.25);
      border-radius: 10px; font-size: 14px; color: #3A2E26; background: #fff;
      font-family: inherit; outline: none; transition: border-color 0.2s ease;
    }
    .form-input:focus { border-color: #D4A574; }
    .form-input::placeholder { color: #C8B8A0; }
    .form-textarea {
      width: 100%; padding: 10px 12px; border: 1px solid rgba(212, 165, 116, 0.25);
      border-radius: 10px; font-size: 13px; color: #3A2E26; background: #fff;
      font-family: inherit; outline: none; resize: none; line-height: 1.5; transition: border-color 0.2s ease;
    }
    .form-textarea:focus { border-color: #D4A574; }
    .form-textarea::placeholder { color: #C8B8A0; }
    .emoji-picker { display: flex; flex-wrap: wrap; gap: 6px; }
    .emoji-option {
      width: 36px; height: 36px; border: 2px solid transparent; background: #fff;
      border-radius: 10px; cursor: pointer; font-size: 20px; display: flex;
      align-items: center; justify-content: center; transition: all 0.15s ease; padding: 0;
    }
    .emoji-option.active { border-color: #D4A574; background: rgba(212, 165, 116, 0.1); }
    .color-picker { display: flex; flex-wrap: wrap; gap: 8px; }
    .color-option {
      width: 28px; height: 28px; border-radius: 50%; border: 3px solid #fff;
      cursor: pointer; padding: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.1); transition: transform 0.15s ease;
    }
    .color-option.active { transform: scale(1.15); box-shadow: 0 0 0 2px #D4A574, 0 2px 6px rgba(0,0,0,0.15); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      flex: 1; padding: 12px 16px; border-radius: 12px; font-size: 14px;
      font-weight: 600; font-family: inherit; cursor: pointer; border: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, #D4A574 0%, #B8865A 100%); color: #fff; box-shadow: 0 4px 14px rgba(212, 165, 116, 0.3);
    }
    .btn-secondary { background: rgba(212, 165, 116, 0.12); color: #8B7355; }
    .btn-danger {
      background: linear-gradient(135deg, #E07A6F 0%, #D9534F 100%); color: #fff; box-shadow: 0 4px 14px rgba(217, 83, 79, 0.3);
    }
  </style>
</head>
